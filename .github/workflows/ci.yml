name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Import-time placeholders only. Offline tests mock external integrations.
      LLM: gpt-4o-mini
      OPENAI_API_KEY: test-key
      OPENAI_BASE_URL: http://127.0.0.1:9/v1
      TAVILY_API_KEY: test-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run unit and API tests
        run: |
          mkdir -p test-results
          uv run pytest \
            --junitxml=test-results/pytest.xml \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: Frontend build (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deep_search_fronted

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deep_search_fronted/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
