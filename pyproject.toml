[project]
name = "deep-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.0.0",
    "deepagents>=0.1.0",
    "fastapi>=0.100.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "langgraph-cli[inmem]>=0.4.31",
    "loguru>=0.7.3",
    "markdown>=3.10.3",
    "mysql-connector-python>=8.0.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "ragflow-sdk==0.19.0",
    "requests>=2.31.0",
    "tavily-python>=0.3.0",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.20.0",
    "xhtml2pdf>=0.2.18",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--cov=agent",
    "--cov=api",
    "--cov=tools",
    "--cov=utils",
    "--cov-report=term-missing",
    "--cov-fail-under=60",
    "--basetemp=tmp"
]
markers = [
    "unit: fast tests without external services",
    "api: FastAPI and WebSocket boundary tests",
    "contract: offline adapter contract tests for external services",
]
tmp_path_retention_count = 0
